# Builds the C++ code and runs the unit tests on every push and pull request.
#
# NOTE: this will show red until you've written main() in both
# manager/src/main.cpp and jobs/prime-counter/main.cpp (Phases 1 and 3).
#
# Later (Phase 8, your part): add a second job here that builds the
# prime-counter Docker image and pushes it to Amazon ECR. See infra/README.md.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset debug

      - name: Build
        run: cmake --build --preset debug --parallel

      - name: Test
        run: ctest --preset debug

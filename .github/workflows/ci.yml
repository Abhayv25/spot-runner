name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci --parallel

      - name: Test
        run: ctest --preset ci

  sanitizers:
    name: tests under ASan and UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset asan
      - name: Build
        run: cmake --build --preset asan --parallel
      - name: Test
        run: ctest --preset asan

  job-image:
    name: build prime-counter image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t prime-counter:ci jobs/prime-counter
      - name: Smoke test
        run: |
          docker run --rm -e TARGET=1000000 prime-counter:ci | tee out.txt
          grep -q "done: 78498 primes" out.txt
          docker image inspect prime-counter:ci --format 'image size: {{.Size}} bytes'

  chaos:
    name: chaos test (process runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake --preset release
          cmake --build --preset release --parallel
      - name: Run
        run: >
          python3 scripts/chaos_test.py
          --manager build/release/manager/spot-runner
          --runtime process
          --image build/release/jobs/prime-counter/prime-counter
          --managers 3 --jobs 12 --min-target 8000000 --max-target 16000000
          --report chaos-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chaos-report
          path: chaos-report.json

  terraform:
    name: terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -backend=false
      - run: terraform validate
